# Nginx cumple dos roles:
#   1. Sirve el front estático (index.html, css, js).
#   2. Hace de API gateway: reenvía /api/<servicio>/... al microservicio.
#      La barra final en proxy_pass quita el prefijo: /api/citas/5 -> citas:8003/5

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # ^~ evita que la regla de archivos .js/.css de abajo capture rutas de la API.
    location ^~ /api/pacientes/ { proxy_pass http://pacientes:8001/; }
    location ^~ /api/medicos/   { proxy_pass http://medicos:8002/; }
    location ^~ /api/citas/     { proxy_pass http://citas:8003/; }
    location ^~ /api/recetas/   { proxy_pass http://recetas:8004/; }

    # El navegador revalida el front en cada carga: tras un despliegue nadie se queda con JS viejo.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
